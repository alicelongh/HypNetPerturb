[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnetperturb"
version = "0.1.0"
description = "Hyperbolic network perturbation metrics and embeddings"
authors = [
    { name = "Alice Longhena" }
]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "networkx>=2.8",
  "scikit-learn>=1.2",
  "matplotlib>=3.6"
]

[tool.setuptools.packages.find]
where = ["."]
